<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冒险者成长系统 V2</title><style>body{background:#151326;color:#fff;font-family:Microsoft YaHei;padding:20px}.box{max-width:700px;margin:auto;background:#272343;border-radius:20px;padding:25px;border:2px solid #8d6cff}.card,.task{background:#332d55;padding:12px;border-radius:12px;margin:10px 0}.ability{font-size:28px;color:#ffd54a}button{background:#8d6cff;color:white;border:0;border-radius:8px;padding:8px 15px;cursor:pointer}.task{display:flex;justify-content:space-between}input{padding:8px;border-radius:8px;border:0;width:65%}</style></head><body><div class="box"><h1>⚔️ 冒险者成长系统 V2</h1><div class="card"><div class="ability">✨ 能力值 <span id="power">0</span></div><div>等级 Lv.<span id="level">1</span> | 职业：创业冒险者</div></div><div class="card"><h3>📊 属性</h3>🧠认知力：<span id="know">0</span><br>💼商业力：<span id="biz">0</span><br>⚡执行力：<span id="exec">0</span><br>💪体力：<span id="health">0</span><p>⚠️ 怠慢惩罚：24小时未完成任务，每项属性 -0.1</p></div><h2>📜 今日任务</h2><div id="tasks"></div><h2>🏆 成就</h2><div class="card" id="badge"></div><h2>➕ 新任务</h2><input id="newTask" placeholder="输入成长任务"><button onclick="addTask()">接取</button></div><script>let d=JSON.parse(localStorage.getItem('rpg2'))||{p:0,k:0,b:0,e:0,h:0,last:Date.now(),t:[{n:'阅读30分钟',r:2,a:'k'},{n:'学习行业知识',r:3,a:'b'},{n:'运动30分钟',r:3,a:'h'}]};function penalty(){let now=Date.now();if(now-d.last>=86400000&&!d.t.some(x=>!x.done)){d.k=Math.max(0,d.k-.1);d.b=Math.max(0,d.b-.1);d.e=Math.max(0,d.e-.1);d.h=Math.max(0,d.h-.1);d.last=now}}function save(){d.last=Date.now();localStorage.setItem('rpg2',JSON.stringify(d));show()}function show(){penalty();power.innerText=d.p;level.innerText=Math.floor(d.p/50)+1;know.innerText=d.k.toFixed(1);biz.innerText=d.b.toFixed(1);exec.innerText=d.e.toFixed(1);health.innerText=d.h.toFixed(1);tasks.innerHTML='';d.t.forEach((x,i)=>tasks.innerHTML+=`<div class="task">${x.n} +${x.r}<button onclick="completeTask(${i})">${x.done?'完成':'挑战'}</button></div>`);badge.innerHTML=d.p>=100?'🏆成长大师':d.p>=50?'🥈初级冒险者':'🌱新手冒险者'}function completeTask(i){let x=d.t[i];if(!x.done){x.done=true;d.p+=x.r;d[x.a]+=x.r;save()}}function addTask(){let i=document.getElementById('newTask');if(i.value.trim()){d.t.push({n:i.value.trim(),r:2,a:'e',done:false});i.value='';save()}}show()</script></body></html>
