<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冒险者成长系统 V4</title><style>body{background:#151326;color:#fff;font-family:Microsoft YaHei;padding:20px}.box{max-width:700px;margin:auto;background:#272343;border-radius:20px;padding:25px;border:2px solid #8d6cff}.card,.task{background:#332d55;padding:12px;border-radius:12px;margin:10px 0}.ability{font-size:28px;color:#ffd54a}button{background:#8d6cff;color:white;border:0;border-radius:8px;padding:8px 15px}.task{display:flex;justify-content:space-between;align-items:center}input{padding:8px;width:65%}.warn{color:#ff7777}</style></head><body><div class="box"><h1>⚔️ 冒险者成长系统 V4</h1><div class="card"><div class="ability">✨能力值 <span id="power">0</span></div>等级 Lv.<span id="level">1</span><br>😴疲劳值 <span id="fatigue">0</span></div><div class="card">📊属性<br>🧠认知力 <span id="know">0</span><br>💼商业力 <span id="biz">0</span><br>⚡执行力 <span id="exec">0</span><br>💪体力 <span id="health">0</span><p class="warn">任务超过24小时未完成将触发惩罚</p></div><h2>📜任务</h2><div id="tasks"></div><h2>➕接取任务</h2><input id="newTask" placeholder="输入成长任务"><button onclick="addTask()">接取</button></div><script>let d=JSON.parse(localStorage.getItem('rpg3'))||{p:0,k:0,b:0,e:0,h:0,f:0,t:[{n:'阅读30分钟',r:2,a:'k',done:false,time:Date.now()},{n:'学习行业知识',r:3,a:'b',done:false,time:Date.now()},{n:'运动30分钟',r:3,a:'h',done:false,time:Date.now()}]};function check(){let now=Date.now();d.t.forEach(x=>{if(!x.done&&!x.penalty&&now-x.time>=86400000){d[x.a]=Math.max(0,d[x.a]-.5);d.f++;x.penalty=true}})}function save(){localStorage.setItem('rpg3',JSON.stringify(d));show()}function show(){check();power.innerText=d.p;level.innerText=Math.floor(d.p/50)+1;know.innerText=d.k.toFixed(1);biz.innerText=d.b.toFixed(1);exec.innerText=d.e.toFixed(1);health.innerText=d.h.toFixed(1);fatigue.innerText=d.f;tasks.innerHTML='';d.t.forEach((x,i)=>tasks.innerHTML+=`<div class='task'>${x.n}<span>${x.done?'✅完成':'剩余'+Math.max(0,24-Math.floor((Date.now()-x.time)/3600000))+'小时'} <button onclick='complete(${i})'>挑战</button></span></div>`);localStorage.setItem('rpg3',JSON.stringify(d))}function complete(i){let x=d.t[i];if(!x.done){x.done=true;d.p+=x.r;d[x.a]+=x.r;save()}}function addTask(){let v=document.getElementById('newTask').value.trim();if(v){d.t.push({n:v,r:2,a:'e',done:false,time:Date.now()});document.getElementById('newTask').value='';save()}}show()</script></body></html>
