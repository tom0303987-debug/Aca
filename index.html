<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>冒险者成长系统 V5</title>
<style>
:root{--bg:#120f22;--panel:#24203d;--card:#332d55;--card2:#3a3360;--purple:#8d6cff;--purple2:#b09cff;--gold:#ffd54a;--green:#77e59b;--red:#ff7f88;--muted:#b8b3cc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#251b48 0,#120f22 48%,#0d0b18 100%);color:#fff;font-family:"Microsoft YaHei",system-ui,-apple-system,sans-serif;min-height:100vh;padding:18px}.app{max-width:820px;margin:auto}.hero,.panel{background:rgba(36,32,61,.96);border:1px solid rgba(141,108,255,.5);border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.28);padding:18px;margin-bottom:14px}.hero{border:2px solid var(--purple)}h1{margin:0 0 14px;font-size:26px}h2{font-size:19px;margin:4px 0 12px}.topgrid,.stats,.formgrid,.shopgrid{display:grid;gap:10px}.topgrid{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(4,1fr)}.mini,.stat{background:var(--card);border-radius:12px;padding:12px}.mini b,.stat b{display:block;font-size:20px;margin-top:4px}.power{color:var(--gold)}.green{color:var(--green)}.warn{color:var(--red)}.muted{color:var(--muted);font-size:13px}.statusline{margin-top:10px;color:var(--purple2)}.task{background:var(--card);padding:13px;border-radius:13px;margin:9px 0;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.task.done{opacity:.62}.task.overdue{border:1px solid rgba(255,127,136,.65)}.task-title{font-weight:700}.task-meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}button{border:0;border-radius:9px;background:var(--purple);color:#fff;padding:9px 13px;cursor:pointer;font-weight:700}button.secondary{background:#51496f}button.danger{background:#7c3945}button:disabled{opacity:.45;cursor:not-allowed}input,select{width:100%;border:1px solid #5e557d;background:#1e1a34;color:#fff;border-radius:9px;padding:10px;outline:none}.formgrid{grid-template-columns:2fr 1fr 1fr auto;align-items:end}.shopgrid{grid-template-columns:1fr auto auto;align-items:end}.reward{background:var(--card);padding:12px;border-radius:11px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{display:inline-block;background:#4a416e;border:1px solid #7566ad;border-radius:999px;padding:6px 10px;margin:4px 4px 0 0;font-size:13px}.locked{opacity:.35}.log{font-size:13px;color:var(--muted);padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}.notice{min-height:24px;margin-top:8px;font-size:13px;color:var(--green)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.section-note{font-size:12px;color:var(--muted);margin:-4px 0 10px}.empty{color:var(--muted);padding:10px 0}.footer{color:#8f88a5;text-align:center;font-size:12px;padding:10px 0 24px}@media(max-width:700px){body{padding:10px}.topgrid,.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr 1fr}.formgrid .wide{grid-column:1/-1}.shopgrid{grid-template-columns:1fr 1fr}.shopgrid .wide{grid-column:1/-1}.task{grid-template-columns:1fr}.actions{justify-content:flex-start}h1{font-size:22px}}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <h1>⚔️ 冒险者成长系统 V5</h1>
    <div class="topgrid">
      <div class="mini"><span class="muted">✨ 可用能力值</span><b class="power" id="power">0</b></div>
      <div class="mini"><span class="muted">🆙 等级</span><b id="level">Lv.1</b></div>
      <div class="mini"><span class="muted">🔥 连续天数</span><b class="green" id="streak">0天</b></div>
      <div class="mini"><span class="muted">😴 疲劳值</span><b id="fatigue">0</b></div>
    </div>
    <div class="statusline" id="state">状态：新手冒险者</div>
  </section>

  <section class="panel">
    <h2>📊 四维属性</h2>
    <div class="stats">
      <div class="stat">🧠 认知力<b id="know">0.0</b></div>
      <div class="stat">💼 商业力<b id="biz">0.0</b></div>
      <div class="stat">⚡ 执行力<b id="exec">0.0</b></div>
      <div class="stat">💪 体力<b id="health">0.0</b></div>
    </div>
    <div class="section-note">规则：任务接取后 24 小时内未完成，会对该任务对应属性 -0.5，疲劳值 +1；每个任务只惩罚一次。</div>
  </section>

  <section class="panel">
    <h2>📜 任务大厅</h2>
    <div id="tasks"></div>
    <div class="toolbar"><button class="secondary" onclick="archiveDone()">归档已完成</button></div>
  </section>

  <section class="panel">
    <h2>➕ 接取新任务</h2>
    <div class="formgrid">
      <div class="wide"><label class="muted">任务名称</label><input id="taskName" maxlength="40" placeholder="例如：分析3个竞品"></div>
      <div><label class="muted">成长属性</label><select id="taskAttr"><option value="e">⚡执行力</option><option value="k">🧠认知力</option><option value="b">💼商业力</option><option value="h">💪体力</option></select></div>
      <div><label class="muted">奖励</label><select id="taskReward"><option value="1">+1</option><option value="2" selected>+2</option><option value="3">+3</option><option value="4">+4</option><option value="5">+5</option></select></div>
      <button onclick="addTask()">接取</button>
    </div>
    <div class="notice" id="notice"></div>
  </section>

  <section class="panel">
    <h2>🎁 奖励商店</h2>
    <div class="section-note">兑换只消耗“可用能力值”，等级按累计获得值计算，不会因为兑换而降级。</div>
    <div id="rewards"></div>
    <div class="shopgrid">
      <div class="wide"><label class="muted">自定义奖励</label><input id="rewardName" maxlength="30" placeholder="例如：看一场电影"></div>
      <div><label class="muted">所需能力值</label><input id="rewardCost" type="number" min="1" max="999" value="20"></div>
      <button onclick="addReward()">添加</button>
    </div>
  </section>

  <section class="panel">
    <h2>🏆 成就</h2>
    <div id="badges"></div>
  </section>

  <section class="panel">
    <h2>📖 冒险日志</h2>
    <div id="logs"></div>
  </section>
  <div class="footer">数据保存在当前浏览器本地设备中</div>
</div>
<script>
const DAY=86400000;
const attrNames={k:'认知力',b:'商业力',e:'执行力',h:'体力'};
const attrIcons={k:'🧠',b:'💼',e:'⚡',h:'💪'};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function todayKey(ts=Date.now()){const x=new Date(ts);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function dayDiff(a,b){const A=new Date(a+'T00:00:00'),B=new Date(b+'T00:00:00');return Math.round((B-A)/DAY)}
function fresh(){const now=Date.now();return{version:5,p:0,xp:0,k:0,b:0,e:0,h:0,f:0,streak:0,lastCompleteDay:'',completed:0,t:[{id:uid(),n:'阅读30分钟',r:2,a:'k',done:false,time:now,penalty:false},{id:uid(),n:'学习行业知识',r:3,a:'b',done:false,time:now,penalty:false},{id:uid(),n:'运动30分钟',r:3,a:'h',done:false,time:now,penalty:false}],rewards:[{id:uid(),n:'休息30分钟',c:10},{id:uid(),n:'娱乐时间',c:30},{id:uid(),n:'特殊奖励',c:50}],logs:[]}}
function load(){let raw=null;try{raw=JSON.parse(localStorage.getItem('rpg5')||localStorage.getItem('rpg3')||'null')}catch(e){};let d=raw||fresh();d.version=5;['p','k','b','e','h','f'].forEach(x=>d[x]=Number(d[x])||0);d.xp=Number.isFinite(Number(d.xp))?Number(d.xp):d.p;d.completed=Number(d.completed)||((d.t||[]).filter(x=>x.done).length);d.streak=Number(d.streak)||0;d.lastCompleteDay=d.lastCompleteDay||'';d.t=Array.isArray(d.t)?d.t:[];d.t.forEach(x=>{x.id=x.id||uid();x.r=Math.min(5,Math.max(1,Number(x.r)||2));x.a=attrNames[x.a]?x.a:'e';x.time=Number(x.time)||Date.now();x.done=!!x.done;x.penalty=!!x.penalty});d.rewards=Array.isArray(d.rewards)&&d.rewards.length?d.rewards:[{id:uid(),n:'休息30分钟',c:10},{id:uid(),n:'娱乐时间',c:30},{id:uid(),n:'特殊奖励',c:50}];d.rewards.forEach(x=>{x.id=x.id||uid();x.c=Math.max(1,Number(x.c)||10)});d.logs=Array.isArray(d.logs)?d.logs.slice(0,30):[];return d}
let d=load();
function log(msg){d.logs.unshift({t:Date.now(),m:msg});d.logs=d.logs.slice(0,30)}
function persist(){localStorage.setItem('rpg5',JSON.stringify(d))}
function actualReward(base){if(d.f>=10)return Math.max(1,base-2);if(d.f>=5)return Math.max(1,base-1);return base}
function checkOverdue(){let changed=false;const now=Date.now();d.t.forEach(x=>{if(!x.done&&!x.penalty&&now-x.time>=DAY){d[x.a]=Math.max(0,Math.round((d[x.a]-.5)*10)/10);d.f+=1;x.penalty=true;log(`⏰「${x.n}」逾期：${attrNames[x.a]} -0.5，疲劳 +1`);changed=true}});if(changed)persist()}
function updateStreak(){const today=todayKey();if(d.lastCompleteDay===today)return false;if(!d.lastCompleteDay)d.streak=1;else{const diff=dayDiff(d.lastCompleteDay,today);d.streak=diff===1?d.streak+1:1}d.lastCompleteDay=today;return true}
function completeTask(id){checkOverdue();const x=d.t.find(v=>v.id===id);if(!x||x.done)return;const reward=actualReward(x.r);x.done=true;d.p+=reward;d.xp+=reward;d[x.a]=Math.round((d[x.a]+reward)*10)/10;d.completed+=1;const newDay=updateStreak();if(d.f>0)d.f-=1;log(`✅ 完成「${x.n}」：+${reward}能力值，${attrNames[x.a]} +${reward}${d.f>=5?'（疲劳减益）':''}`);if(newDay&&d.streak>0&&d.streak%3===0){d.p+=1;d.xp+=1;log(`🔥 连续完成 ${d.streak} 天：额外 +1 能力值`)}persist();render()}
function addTask(){const name=document.getElementById('taskName').value.trim();if(!name){notify('请输入任务名称',true);return}const a=document.getElementById('taskAttr').value;const r=Number(document.getElementById('taskReward').value);d.t.push({id:uid(),n:name,r,a,done:false,time:Date.now(),penalty:false});log(`📜 接取任务「${name}」：24小时倒计时开始`);document.getElementById('taskName').value='';persist();notify('任务接取成功');render()}
function deleteTask(id){const x=d.t.find(v=>v.id===id);if(!x)return;if(!confirm(`确认删除任务「${x.n}」？`))return;d.t=d.t.filter(v=>v.id!==id);log(`🗑️ 删除任务「${x.n}」`);persist();render()}
function archiveDone(){const n=d.t.filter(x=>x.done).length;if(!n){notify('暂无已完成任务');return}d.t=d.t.filter(x=>!x.done);log(`📦 归档 ${n} 个已完成任务`);persist();render()}
function addReward(){const name=document.getElementById('rewardName').value.trim();const cost=Math.floor(Number(document.getElementById('rewardCost').value));if(!name||!Number.isFinite(cost)||cost<1){notify('请填写有效的奖励名称和能力值',true);return}d.rewards.push({id:uid(),n:name,c:cost});document.getElementById('rewardName').value='';persist();notify('奖励已加入商店');render()}
function buyReward(id){const x=d.rewards.find(v=>v.id===id);if(!x)return;if(d.p<x.c){notify(`能力值不足，还差 ${x.c-d.p}`,true);return}if(!confirm(`消耗 ${x.c} 能力值兑换「${x.n}」？`))return;d.p-=x.c;log(`🎁 兑换「${x.n}」：-${x.c}能力值`);persist();notify('兑换成功');render()}
function deleteReward(id){d.rewards=d.rewards.filter(x=>x.id!==id);persist();render()}
function remaining(x){if(x.done)return '已完成';const ms=DAY-(Date.now()-x.time);if(ms<=0)return x.penalty?'已逾期 · 已惩罚':'已逾期';const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);return `剩余 ${h}小时${m}分`}
function stateText(){if(d.f>=10)return '状态：🔻 低效状态 · 任务奖励 -2';if(d.f>=5)return '状态：😵 疲劳状态 · 任务奖励 -1';if(d.streak>=7)return '状态：🔥 自律者';if(d.streak>=3)return '状态：⚡ 连胜中';return '状态：🌱 稳定成长'}
function achievements(){return[{name:'初次行动',ok:d.completed>=1},{name:'行动者·10',ok:d.completed>=10},{name:'自律3日',ok:d.streak>=3},{name:'自律7日',ok:d.streak>=7},{name:'累计50能力',ok:d.xp>=50},{name:'累计100能力',ok:d.xp>=100}]}
function notify(msg,bad=false){const n=document.getElementById('notice');n.textContent=msg;n.style.color=bad?'var(--red)':'var(--green)';clearTimeout(notify.t);notify.t=setTimeout(()=>n.textContent='',2600)}
function render(){checkOverdue();document.getElementById('power').textContent=d.p;document.getElementById('level').textContent='Lv.'+(Math.floor(d.xp/50)+1);document.getElementById('streak').textContent=d.streak+'天';document.getElementById('fatigue').textContent=d.f;document.getElementById('state').textContent=stateText();document.getElementById('know').textContent=d.k.toFixed(1);document.getElementById('biz').textContent=d.b.toFixed(1);document.getElementById('exec').textContent=d.e.toFixed(1);document.getElementById('health').textContent=d.h.toFixed(1);
 const taskBox=document.getElementById('tasks');taskBox.innerHTML='';if(!d.t.length)taskBox.innerHTML='<div class="empty">暂无任务，去接取一个新的成长任务吧。</div>';d.t.forEach(x=>{const overdue=!x.done&&Date.now()-x.time>=DAY;const div=document.createElement('div');div.className='task'+(x.done?' done':'')+(overdue?' overdue':'');div.innerHTML=`<div><div class="task-title">${attrIcons[x.a]} ${escapeHtml(x.n)}</div><div class="task-meta">奖励 +${x.r} · ${attrNames[x.a]} · ${remaining(x)}${x.penalty?' · ⚠️已触发逾期惩罚':''}</div></div><div class="actions"><button ${x.done?'disabled':''} onclick="completeTask('${x.id}')">${x.done?'已完成':'完成'}</button><button class="danger" onclick="deleteTask('${x.id}')">删除</button></div>`;taskBox.appendChild(div)});
 const rewardBox=document.getElementById('rewards');rewardBox.innerHTML='';d.rewards.forEach(x=>{const row=document.createElement('div');row.className='reward';row.innerHTML=`<div><b>${escapeHtml(x.n)}</b><div class="muted">需要 ${x.c} 能力值</div></div><div class="actions"><button onclick="buyReward('${x.id}')">兑换</button><button class="secondary" onclick="deleteReward('${x.id}')">移除</button></div>`;rewardBox.appendChild(row)});
 const badgeBox=document.getElementById('badges');badgeBox.innerHTML=achievements().map(x=>`<span class="badge ${x.ok?'':'locked'}">${x.ok?'🏆':'🔒'} ${x.name}</span>`).join('');
 const logBox=document.getElementById('logs');logBox.innerHTML=d.logs.length?d.logs.slice(0,12).map(x=>`<div class="log">${new Date(x.t).toLocaleString()} · ${escapeHtml(x.m)}</div>`).join(''):'<div class="empty">暂无冒险记录</div>';
 persist()}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
render();setInterval(render,60000);
</script>
</body>
</html>
