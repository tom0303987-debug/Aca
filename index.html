<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冒险者成长系统 V2</title><style>body{background:#151326;color:#fff;font-family:Microsoft YaHei;padding:20px}.box{max-width:700px;margin:auto;background:#272343;border-radius:20px;padding:25px;border:2px solid #8d6cff}.card{background:#332d55;padding:15px;border-radius:12px;margin:12px 0}.ability{font-size:28px;color:#ffd54a}button{background:#8d6cff;color:white;border:0;border-radius:8px;padding:8px 15px;cursor:pointer}.task{display:flex;justify-content:space-between;margin:8px 0;padding:10px;background:#3a3360;border-radius:10px}.done{text-decoration:line-through;opacity:.5}input{padding:8px;border-radius:8px;border:0;width:65%}</style></head><body><div class="box"><h1>⚔️ 冒险者成长系统 V2</h1><div class="card"><div class="ability">✨ 能力值 <span id="power">0</span></div><div>等级 Lv.<span id="level">1</span> | 职业：创业冒险者</div></div><div class="card"><h3>📊 属性</h3><div>🧠 认知力：<span id="know">0</span></div><div>💼 商业力：<span id="biz">0</span></div><div>⚡ 执行力：<span id="exec">0</span></div><div>💪 体力：<span id="health">0</span></div></div><h2>📜 今日任务</h2><div id="tasks"></div><h2>🏆 成就</h2><div class="card" id="badge">暂无成就</div><h2>➕ 新任务</h2><input id="newTask" placeholder="输入成长任务"><button onclick="addTask()">接取</button></div><script>let d=JSON.parse(localStorage.getItem('rpg2'))||{p:0,k:0,b:0,e:0,h:0,t:[{n:'阅读30分钟',r:2,a:'k'},{n:'学习行业知识',r:3,a:'b'},{n:'运动30分钟',r:3,a:'h'}]};function save(){localStorage.setItem('rpg2',JSON.stringify(d));show()}function show(){document.getElementById('power').innerText=d.p;document.getElementById('level').innerText=Math.floor(d.p/50)+1;document.getElementById('know').innerText=d.k;document.getElementById('biz').innerText=d.b;document.getElementById('exec').innerText=d.e;document.getElementById('health').innerText=d.h;let box=document.getElementById('tasks');box.innerHTML='';d.t.forEach((x,i)=>{box.innerHTML+=`<div class="task ${x.done?'done':''}">${x.n} +${x.r}能力值 <button onclick="completeTask(${i})">${x.done?'完成':'挑战'}</button></div>`});document.getElementById('badge').innerHTML=d.p>=100?'🏆 成长大师':d.p>=50?'🥈 初级冒险者':'🌱 新手冒险者'}function completeTask(i){let x=d.t[i];if(!x.done){x.done=true;d.p+=x.r;d[x.a]+=x.r;save()}}function addTask(){let input=document.getElementById('newTask');if(input.value.trim()){d.t.push({n:input.value.trim(),r:2,a:'e',done:false});input.value='';save()}}show()</script></body></html>
