<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>冒险者成长系统</title>
<style>
body{font-family:"Microsoft YaHei";background:#171526;color:#fff;padding:20px}.box{max-width:700px;margin:auto;background:#24213d;border:2px solid #8b6cff;border-radius:20px;padding:25px;box-shadow:0 0 25px #000}.status{background:#302a52;padding:15px;border-radius:15px}.ability{font-size:28px;color:#ffd54a}.level{color:#7ee787}.task{display:flex;justify-content:space-between;padding:12px;margin:8px 0;background:#332d55;border-radius:12px}.done{opacity:.5;text-decoration:line-through}button{background:#8b6cff;color:#fff;border:0;border-radius:10px;padding:8px 15px}input{padding:8px;border-radius:8px;border:0;width:65%}.shop p{background:#332d55;padding:12px;border-radius:10px}
</style>
</head>
<body>
<div class="box">
<h1>⚔️ 冒险者成长系统</h1>
<div class="status"><div class="ability">✨ 能力值：<span id="coin">0</span></div><div class="level">等级：Lv.<span id="lv">1</span> 新手冒险者</div></div>
<h2>📜 今日任务</h2><div id="tasks"></div>
<h2>➕ 创建任务</h2><input id="newTask" placeholder="输入成长任务"><button onclick="addTask()">接取</button>
<h2>🎁 奖励商店</h2><div class="shop"><p>☕ 休息30分钟 - 10能力值 <button onclick="buy(10)">兑换</button></p><p>🎮 娱乐时间 - 30能力值 <button onclick="buy(30)">兑换</button></p><p>🏆 特殊奖励 - 50能力值 <button onclick="buy(50)">兑换</button></p></div>
</div>
<script>
let data=JSON.parse(localStorage.getItem('rpgTask'))||{coin:0,tasks:[{name:'阅读30分钟',done:false,reward:2},{name:'运动30分钟',done:false,reward:3},{name:'学习成长知识',done:false,reward:3}]};
function save(){localStorage.setItem('rpgTask',JSON.stringify(data));render()}
function render(){document.getElementById('coin').innerText=data.coin;document.getElementById('lv').innerText=Math.floor(data.coin/50)+1;let box=document.getElementById('tasks');box.innerHTML='';data.tasks.forEach((t,i)=>{box.innerHTML+=`<div class="task ${t.done?'done':''}"><span>${t.name} +${t.reward}能力值</span><button onclick="complete(${i})">${t.done?'完成':'挑战'}</button></div>`})}
function complete(i){if(!data.tasks[i].done){data.tasks[i].done=true;data.coin+=data.tasks[i].reward;save()}}
function addTask(){let n=document.getElementById('newTask').value;if(n){data.tasks.push({name:n,done:false,reward:2});save()}}
function buy(c){if(data.coin>=c){data.coin-=c;alert('奖励兑换成功！');save()}else alert('能力值不足')}
render();
</script>
</body></html>
