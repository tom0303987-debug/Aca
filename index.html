<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务奖励系统</title>
<style>
body{font-family:Arial,"Microsoft YaHei";background:#f5f5f5;margin:0;padding:30px}.box{max-width:700px;margin:auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 5px 20px #ddd}.coin{font-size:24px;color:#d99b00}.task{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #eee}.done{text-decoration:line-through;color:#999}button{padding:8px 14px;border:0;border-radius:8px;background:#333;color:#fff;cursor:pointer}.shop button{background:#8a5cff}input{padding:8px;width:70%}</style>
</head>
<body>
<div class="box">
<h1>🎯 我的任务系统</h1>
<div class="coin">奖励货币：<span id="coin">0</span> 金币</div>
<h2>今日任务</h2>
<div id="tasks"></div>
<h2>添加每日任务</h2>
<input id="newTask" placeholder="例如：学习30分钟"><button onclick="addTask()">添加</button>
<h2>兑换商城</h2>
<div class="shop">
<p>☕ 奶茶券 - 50金币 <button onclick="buy(50)">兑换</button></p>
<p>🎮 游戏时间 - 100金币 <button onclick="buy(100)">兑换</button></p>
<p>🎁 自定义奖励 - 200金币 <button onclick="buy(200)">兑换</button></p>
</div>
</div>
<script>
let data=JSON.parse(localStorage.getItem('taskData'))||{coin:0,tasks:[{name:'阅读30分钟',done:false,reward:10},{name:'运动30分钟',done:false,reward:20}]};
function save(){localStorage.setItem('taskData',JSON.stringify(data));render()}
function render(){document.getElementById('coin').innerText=data.coin;let box=document.getElementById('tasks');box.innerHTML='';data.tasks.forEach((t,i)=>{box.innerHTML+=`<div class="task ${t.done?'done':''}"><span>${t.name} (+${t.reward})</span><button onclick="complete(${i})">${t.done?'已完成':'完成'}</button></div>`})}
function complete(i){if(!data.tasks[i].done){data.tasks[i].done=true;data.coin+=data.tasks[i].reward;save()}}
function addTask(){let n=document.getElementById('newTask').value;if(n){data.tasks.push({name:n,done:false,reward:10});save();document.getElementById('newTask').value=''}}
function buy(cost){if(data.coin>=cost){data.coin-=cost;alert('兑换成功！');save()}else alert('金币不足')}
render();
</script>
</body>
</html>
